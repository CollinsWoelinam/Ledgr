plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ledgr'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "com.ledgr.sms"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // HeadlessJsTaskService, to run the sync in JS while Ledgr isn't open.
  implementation 'com.facebook.react:react-android'
}
